name: MCP Registry status

# One-off: change the lifecycle status (active | deprecated | deleted) of a
# published server version in the MCP Registry. Runs under GitHub OIDC, which
# authorizes the io.github.cap-js namespace via the repo owner — a personal
# login only works for org Owners, so this is the reliable path.

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      status:
        description: New lifecycle status
        required: true
        type: choice
        options:
          - deprecated
          - deleted
          - active
      version:
        description: Server version to target (server.json .version, e.g. 1.0.0). Leave empty to apply to all versions.
        required: false
        type: string
      message:
        description: Reason for the change (required for deprecated/deleted; must be empty for active).
        required: false
        type: string

jobs:
  status:
    runs-on: ubuntu-latest
    # `npm` environment gates this behind required-reviewer approval (destructive
    # metadata change) and restricts it to main via its branch policy.
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update status
        shell: bash
        env:
          STATUS: ${{ inputs.status }}
          VERSION: ${{ inputs.version }}
          MESSAGE: ${{ inputs.message }}
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          server_name=$(jq -r '.name' server.json)
          args=(status --status "$STATUS")
          [ -n "$MESSAGE" ] && args+=(--message "$MESSAGE")
          if [ -n "$VERSION" ]; then
            ./mcp-publisher "${args[@]}" "$server_name" "$VERSION"
          else
            ./mcp-publisher "${args[@]}" --all-versions --yes "$server_name"
          fi
